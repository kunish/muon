<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/muon-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; media-src 'self' blob: data: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; frame-src 'none'"
    />
    <title>Muon</title>
    <style>
      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #f6f7fb;
        color: #1f2329;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .muon-boot-shell {
        position: relative;
        display: grid;
        height: 100%;
        min-height: 0;
        grid-template-columns: 68px minmax(220px, 320px) minmax(0, 1fr);
        overflow: hidden;
        background: #f6f7fb;
      }

      .muon-boot-rail,
      .muon-boot-sidebar {
        border-right: 1px solid #dee3eb;
        background: #eef2f7;
      }

      .muon-boot-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 18px 12px;
      }

      .muon-boot-brand {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 10px;
        background: #3370ff;
        color: #fff;
        font-size: 20px;
        font-weight: 700;
      }

      .muon-boot-sidebar {
        min-height: 0;
        overflow: hidden;
        padding: 20px 14px;
      }

      .muon-boot-profile {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .muon-boot-list {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .muon-boot-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .muon-boot-chat {
        display: flex;
        min-width: 0;
        min-height: 0;
        flex-direction: column;
        background: #f8fafc;
      }

      .muon-boot-header {
        display: flex;
        height: 64px;
        flex-shrink: 0;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid #dee3eb;
        padding: 0 20px;
      }

      .muon-boot-messages {
        display: grid;
        align-content: start;
        gap: 20px;
        min-height: 0;
        flex: 1;
        overflow: hidden;
        padding: 24px 20px;
      }

      .muon-boot-message {
        display: grid;
        width: min(58%, 560px);
        gap: 10px;
        border: 1px solid #dee3eb;
        border-radius: 14px;
        background: #fff;
        padding: 14px 16px;
      }

      .muon-boot-message:nth-child(2),
      .muon-boot-message:nth-child(4) {
        justify-self: end;
      }

      .muon-boot-composer {
        flex-shrink: 0;
        border-top: 1px solid #dee3eb;
        padding: 16px 20px;
      }

      .muon-boot-status {
        position: absolute;
        left: 50%;
        bottom: 28px;
        display: flex;
        transform: translateX(-50%);
        align-items: center;
        gap: 10px;
        border: 1px solid #dee3eb;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        padding: 9px 14px;
        color: #646a73;
        font-size: 13px;
        backdrop-filter: blur(12px);
      }

      .muon-boot-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid #3370ff;
        border-top-color: transparent;
        border-radius: 999px;
        animation: muon-boot-spin 0.9s linear infinite;
      }

      .muon-boot-shimmer {
        border-radius: 8px;
        background: linear-gradient(90deg, #dfe5ee 0%, #edf2f8 42%, #dfe5ee 100%);
        background-size: 200% 100%;
        animation: muon-boot-shimmer 1.8s ease-in-out infinite;
      }

      @keyframes muon-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes muon-boot-shimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      @media (max-width: 760px) {
        .muon-boot-shell {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .muon-boot-sidebar {
          display: none;
        }

        .muon-boot-rail {
          padding-inline: 8px;
        }

        .muon-boot-status {
          bottom: 18px;
          max-width: calc(100% - 32px);
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div data-testid="preload-startup-skeleton" class="muon-boot-shell" role="status" aria-live="polite">
        <aside class="muon-boot-rail" aria-hidden="true">
          <div class="muon-boot-brand">M</div>
          <div class="muon-boot-shimmer" style="width: 36px; height: 36px"></div>
          <div class="muon-boot-shimmer" style="width: 36px; height: 36px"></div>
          <div class="muon-boot-shimmer" style="width: 36px; height: 36px"></div>
          <div class="muon-boot-shimmer" style="width: 36px; height: 36px"></div>
        </aside>
        <aside class="muon-boot-sidebar" aria-hidden="true">
          <div class="muon-boot-profile">
            <div class="muon-boot-shimmer" style="width: 36px; height: 36px; border-radius: 999px"></div>
            <div style="flex: 1">
              <div class="muon-boot-shimmer" style="width: 96px; height: 14px; margin-bottom: 8px"></div>
              <div class="muon-boot-shimmer" style="width: 136px; height: 10px"></div>
            </div>
          </div>
          <div class="muon-boot-shimmer" style="width: 100%; height: 32px"></div>
          <div class="muon-boot-list">
            <div class="muon-boot-row">
              <div class="muon-boot-shimmer" style="width: 40px; height: 40px"></div>
              <div class="muon-boot-shimmer" style="width: 70%; height: 12px"></div>
            </div>
            <div class="muon-boot-row">
              <div class="muon-boot-shimmer" style="width: 40px; height: 40px"></div>
              <div class="muon-boot-shimmer" style="width: 56%; height: 12px"></div>
            </div>
            <div class="muon-boot-row">
              <div class="muon-boot-shimmer" style="width: 40px; height: 40px"></div>
              <div class="muon-boot-shimmer" style="width: 64%; height: 12px"></div>
            </div>
          </div>
        </aside>
        <main class="muon-boot-chat" aria-hidden="true">
          <header class="muon-boot-header">
            <div class="muon-boot-shimmer" style="width: 40px; height: 40px; border-radius: 999px"></div>
            <div style="flex: 1">
              <div class="muon-boot-shimmer" style="width: 128px; height: 14px; margin-bottom: 8px"></div>
              <div class="muon-boot-shimmer" style="width: 192px; height: 10px"></div>
            </div>
          </header>
          <section class="muon-boot-messages">
            <div class="muon-boot-message">
              <div class="muon-boot-shimmer" style="width: 60%; height: 12px"></div>
              <div class="muon-boot-shimmer" style="width: 100%; height: 10px"></div>
            </div>
            <div class="muon-boot-message">
              <div class="muon-boot-shimmer" style="width: 54%; height: 12px"></div>
              <div class="muon-boot-shimmer" style="width: 88%; height: 10px"></div>
            </div>
            <div class="muon-boot-message">
              <div class="muon-boot-shimmer" style="width: 68%; height: 12px"></div>
              <div class="muon-boot-shimmer" style="width: 94%; height: 10px"></div>
            </div>
          </section>
          <div class="muon-boot-composer">
            <div class="muon-boot-shimmer" style="width: 100%; height: 44px"></div>
          </div>
        </main>
        <div class="muon-boot-status">
          <div class="muon-boot-spinner"></div>
          <span>正在初始化数据...</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
