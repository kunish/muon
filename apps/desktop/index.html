<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/muon-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; media-src 'self' blob: data: https:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; frame-src 'none'"
    />
    <title>Muon</title>
    <style>
      /* Pre-mount logo splash. Mirrors src/app/components/StartupSkeleton.vue so
         the handoff to the Vue app is seamless. The background is matched to the
         app theme at first paint via prefers-color-scheme, because the bundle's
         .dark class only lands after mount and inline scripts are blocked by the
         renderer CSP (script-src 'self'). Explicit light/dark overrides that
         differ from the OS are corrected by useTheme right after mount. */
      :root {
        --boot-bg: #ffffff;
        --boot-muted: #646a73;
        --boot-primary: #007aff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #1a1a1a;
          --boot-muted: #a6a6a6;
        }
      }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--boot-bg);
        color: var(--boot-muted);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      .muon-boot-shell {
        display: flex;
        height: 100%;
        min-height: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        overflow: hidden;
        background: var(--boot-bg);
      }

      .muon-boot-logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
        animation: muon-boot-in 0.5s ease-out both;
      }

      .muon-boot-halo {
        position: absolute;
        height: 96px;
        width: 96px;
        border-radius: 28px;
        background: var(--boot-primary);
        filter: blur(26px);
        opacity: 0.28;
        animation: muon-boot-halo 2.4s ease-in-out infinite;
      }

      .muon-boot-logo {
        position: relative;
        height: 96px;
        width: 96px;
        border-radius: 24px;
        animation: muon-boot-breathe 2.4s ease-in-out infinite;
      }

      .muon-boot-status {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--boot-muted);
        font-size: 13px;
      }

      .muon-boot-spinner {
        height: 14px;
        width: 14px;
        border: 2px solid var(--boot-primary);
        border-top-color: transparent;
        border-radius: 999px;
        animation: muon-boot-spin 0.9s linear infinite;
      }

      @keyframes muon-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes muon-boot-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes muon-boot-halo {
        0%,
        100% {
          opacity: 0.22;
          transform: scale(0.92);
        }
        50% {
          opacity: 0.4;
          transform: scale(1.12);
        }
      }

      @keyframes muon-boot-in {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .muon-boot-logo,
        .muon-boot-halo,
        .muon-boot-spinner,
        .muon-boot-logo-wrap {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div data-testid="preload-startup-skeleton" class="muon-boot-shell" role="status" aria-live="polite">
        <div class="muon-boot-logo-wrap">
          <span class="muon-boot-halo" aria-hidden="true"></span>
          <img class="muon-boot-logo" src="/muon-logo.svg" alt="Muon" width="96" height="96" />
        </div>
        <div class="muon-boot-status">
          <span class="muon-boot-spinner"></span>
          <span>正在启动…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
