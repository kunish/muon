services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: muon
      POSTGRES_USER: muon
      POSTGRES_PASSWORD: muon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  conduit:
    image: matrixconduit/matrix-conduit:latest
    ports:
      - '6167:6167'
    volumes:
      - conduit_data:/var/lib/matrix-conduit
      - ./conduit.toml:/etc/conduit.toml:ro
    environment:
      CONDUIT_CONFIG: /etc/conduit.toml
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - '7880:7880'
      - '7881:7881'
      - '50000-50100:50000-50100/udp'
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml --dev
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: muon
      MINIO_ROOT_PASSWORD: muon12345
    command: server /data --console-address ":9001"
    restart: unless-stopped

  api:
    image: node:22-alpine
    working_dir: /workspace
    env_file:
      - .env
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev:api"
    ports:
      - '8787:8787'
    volumes:
      - ..:/workspace
    environment:
      MUON_API_BASE_URL: http://127.0.0.1:8787
      MUON_ADMIN_BASE_URL: http://127.0.0.1:4174
      MUON_DATABASE_URL: postgres://muon:muon@postgres:5432/muon
      MUON_SESSION_SECRET: local-development-secret
      MUON_MATRIX_ADAPTER: conduit
      MUON_MATRIX_SERVER_URL: http://conduit:6167
      MUON_S3_ENDPOINT: http://minio:9000
      MUON_S3_PUBLIC_BASE_URL: http://127.0.0.1:9000/muon-media
      MUON_S3_BUCKET: muon-media
      MUON_S3_ACCESS_KEY_ID: muon
      MUON_S3_SECRET_ACCESS_KEY: muon12345
      MUON_S3_REGION: auto
      MUON_S3_FORCE_PATH_STYLE: 'true'
    depends_on:
      - postgres
      - conduit
      - minio
    restart: unless-stopped

  admin:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -lc "corepack enable && pnpm install --frozen-lockfile=false && pnpm dev:admin"
    ports:
      - '4174:4174'
    volumes:
      - ..:/workspace
    environment:
      VITE_MUON_API_BASE_URL: http://127.0.0.1:8787
    depends_on:
      - api
    restart: unless-stopped

volumes:
  conduit_data:
  minio_data:
  postgres_data:
